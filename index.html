<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Private Journal</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0a0a0a">
<style>
*{box-sizing:border-box} body{margin:0;font-family:system-ui;background:#0a0a0a;color:#eee;display:flex;flex-direction:column;height:100vh}
header{padding:16px;border-bottom:1px solid #222;display:flex;justify-content:space-between}
#chat{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.bubble{max-width:85%;padding:12px 16px;border-radius:18px;line-height:1.5}
.user{background:#2563eb;align-self:flex-end}.ai{background:#1f1f1f;align-self:flex-start;border:1px solid #2a2a2a}
#composer{display:flex;gap:8px;padding:12px;border-top:1px solid #222;background:#111}
input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;color:#fff;padding:12px;border-radius:12px}
button{background:#2563eb;color:#fff;border:0;padding:12px 18px;border-radius:12px;font-weight:600}
</style>
</head>
<body>
<header><b>Journal • Offline + Mumbai</b><small id="status">● online</small></header>
<div id="chat"></div>
<div id="composer">
<input id="msg" placeholder="How are you feeling? (works offline)" autocomplete="off"/>
<button id="send">Send</button>
</div>
<script>
const DB='journal-db';
function idb(){return new Promise((res,rej)=>{let r=indexedDB.open(DB,1); r.onupgradeneeded=e=>{e.target.result.createObjectStore('entries',{keyPath:'id'}); e.target.result.createObjectStore('outbox',{keyPath:'id'})}; r.onsuccess=()=>res(r.result)})}
async function saveLocal(text,who='user'){const db=await idb(); db.transaction(['entries'],'readwrite').objectStore('entries').add({id:Date.now()+Math.random(),text,who,ts:new Date().toISOString()}); if(who==='user') (await idb()).transaction(['outbox'],'readwrite').objectStore('outbox').add({id:Date.now()+Math.random(),text,ts:new Date().toISOString()})}
function bubble(t,w){const c=document.getElementById('chat'); const d=document.createElement('div'); d.className='bubble '+w; d.textContent=t; c.appendChild(d); c.scrollTop=c.scrollHeight}
async function sync(){try{const db=await idb(); const req=db.transaction(['outbox'],'readonly').objectStore('outbox').getAll(); req.onsuccess=async()=>{for(let i of req.result){await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(i)}); (await idb()).transaction(['outbox'],'readwrite').objectStore('outbox').delete(i.id)}}}catch{}}
async function send(){const input=document.getElementById('msg'); const text=input.value.trim(); if(!text)return; bubble(text,'user'); saveLocal(text,'user'); input.value=''; sync(); try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})}); const d=await r.json(); bubble(d.reply,'ai'); saveLocal(d.reply,'ai'); fetch('https://ntfy.sh/'+localStorage.getItem('ntfy_topic'),{method:'POST',body:text.slice(0,80)})}catch{bubble('Saved offline. I will reflect when online.','ai')}}
document.getElementById('send').onclick=send; document.getElementById('msg').onkeydown=e=>{if(e.key==='Enter')send()};
if('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
let topic=localStorage.getItem('ntfy_topic'); if(!topic){topic=prompt('Enter ntfy topic (e.g. sharjah-journal-ahmed123):')||'sharjah-journal-demo'; localStorage.setItem('ntfy_topic',topic)}
</script>
</body>
</html>
